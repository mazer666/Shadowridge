<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Shadowridge – Endless Descent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&family=Uncial+Antiqua&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="title">
        <div class="title__main">Shadowridge</div>
        <div class="title__sub">Endless Descent (Prototype)</div>
      </div>

      <div class="topbar__hint">
        <span class="kbd">WASD</span> / <span class="kbd">Pfeile</span> bewegen •
        <span class="kbd">R</span> neu generieren •
        <span class="kbd">1–0</span> Hotbar
      </div>
    </header>

    <main class="stage">
      <section class="stage__map">
        <div class="canvasWrap" id="canvasWrap">
          <canvas id="map" aria-label="Dungeon Map"></canvas>

          <div id="hud" class="hud" aria-label="HUD Panels">
            <!-- PARTY -->
            <section class="hudPanel" data-panel-id="party">
              <div class="hudPanel__titlebar" data-drag-handle>
                <div class="hudPanel__title">Party</div>
                <div class="hudPanel__actions">
                  <button class="hudBtn" type="button" data-action="collapse" title="Ein-/Ausklappen" aria-expanded="true">▾</button>
                </div>
              </div>
              <div class="hudPanel__body">
                <div class="muted">Platzhalter: Portraits, HP, Stats.</div>
              </div>
              <div class="hudPanel__resize" data-resize-handle title="Größe ändern"></div>
            </section>

            <!-- INVENTORY -->
            <section class="hudPanel" data-panel-id="inventory">
              <div class="hudPanel__titlebar" data-drag-handle>
                <div class="hudPanel__title">Inventar</div>
                <div class="hudPanel__actions">
                  <button class="hudBtn" type="button" data-action="collapse" title="Ein-/Ausklappen" aria-expanded="true">▾</button>
                </div>
              </div>
              <div class="hudPanel__body">
                <div class="muted">Platzhalter: 8 Slots pro Held, Drag & Drop.</div>
              </div>
              <div class="hudPanel__resize" data-resize-handle title="Größe ändern"></div>
            </section>

            <!-- LOG -->
            <section class="hudPanel" data-panel-id="log">
              <div class="hudPanel__titlebar" data-drag-handle>
                <div class="hudPanel__title logTitle">Log</div>
                <div class="hudPanel__actions">
                  <button class="hudBtn" type="button" data-action="collapse" title="Ein-/Ausklappen" aria-expanded="true">▾</button>
                </div>
              </div>
              <div class="hudPanel__body logBody" id="log">
                <div class="logLine">Hotbar: Auto-Layout (1×10 / 2×5) + Docked Tooltip</div>
              </div>
              <div class="hudPanel__resize" data-resize-handle title="Größe ändern"></div>
            </section>

            <!-- HOTBAR (ohne Überschrift; Layout schaltet per Resize) -->
            <section class="hudPanel hudPanel--hotbar" data-panel-id="hotbar">
              <!-- Minimaler Grip-Balken (ohne Titel) zum Ziehen -->
              <div class="hudPanel__titlebar hudPanel__titlebar--gripOnly" data-drag-handle>
                <div class="hudPanel__actions hudPanel__actions--gripOnly">
                  <button class="hudBtn hudBtn--tiny" type="button" data-action="collapse" title="Ein-/Ausklappen" aria-expanded="true">▾</button>
                </div>
              </div>

              <div class="hudPanel__body hotbarBody">
                <div class="hotbarWrap" aria-label="Hotbar Slots">
                  <div id="hotbarSlots" class="hotbarSlots" role="toolbar" aria-label="Actions (1 bis 0)"></div>

                  <!-- Tooltip: wird per JS in <body> verschoben (fixed), damit nie abgeschnitten -->
                  <div id="hotbarTooltip" class="hotbarTooltip" role="tooltip" aria-hidden="true">
                    <div class="hotbarTooltip__title" id="hotbarTooltipTitle">—</div>
                    <div class="hotbarTooltip__desc" id="hotbarTooltipDesc">—</div>
                    <div class="hotbarTooltip__meta" id="hotbarTooltipMeta"></div>
                  </div>
                </div>
              </div>

              <div class="hudPanel__resize" data-resize-handle title="Größe ändern"></div>
            </section>
          </div>
        </div>

        <div class="statusbar">
          <div id="statusText" class="statusbar__text">Lade…</div>
        </div>

        <!-- MOBILE: Buttons unter der Karte -->
        <nav class="mobileTabs" id="mobileTabs" aria-label="Mobile Panel Buttons">
          <button class="mobileTabBtn" type="button" data-open-panel="party">Party</button>
          <button class="mobileTabBtn" type="button" data-open-panel="inventory">Inventar</button>
          <button class="mobileTabBtn" type="button" data-open-panel="log">Log</button>
          <button class="mobileTabBtn" type="button" data-open-panel="hotbar">Hotbar</button>
        </nav>

        <div class="mobileOverlay" id="mobileOverlay" aria-hidden="true">
          <button class="mobileClose" id="mobileClose" type="button" aria-label="Menü schließen">✕</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
